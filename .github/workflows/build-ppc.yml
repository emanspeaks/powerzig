name: Build Zig for PowerPC 32-bit

# Cross-compiles Zig for $TARGET using the scripts in zig-build
# (https://codeberg.org/emanspeaks/zig-build) and the cross LLVM published by
# emanspeaks/powerzig-bootstrap, smoke-tests it under qemu, and publishes it.
#
# All build logic lives in zig-build; this workflow only schedules it and
# publishes. Each release carries a manifest.json from zig-build/cross-manifest.sh.
# A run builds only if no existing release has the same zig_key, and only once
# powerzig-bootstrap has published LLVM for the matching llvm_key.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      zig_build_ref:
        description: zig-build branch, tag or commit to build from
        type: string
        default: main
      force:
        description: Build and release even if a release with this zig_key exists
        type: boolean
        default: false
  schedule:
    - cron: '0 12 * * *'   # daily; cheap when nothing changed

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  ZIG_BUILD_URL: https://codeberg.org/emanspeaks/zig-build.git
  LLVM_REPO: emanspeaks/powerzig-bootstrap
  TARGET: powerpc-linux-musleabihf
  CPU: baseline
  ZIG_HOST_CPU: baseline
  STAGE3_TESTS: 0
  # tag names of deleted immutable releases; GitHub reserves them forever
  # (v1-v7 were pre-rework builds without LLVM). Add to this when deleting more.
  RESERVED_TAGS: v1 v2 v3 v4 v5 v6 v7
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      zig_build_commit: ${{ steps.keys.outputs.zig_build_commit }}
      host_key: ${{ steps.keys.outputs.host_key }}
      zig_key: ${{ steps.keys.outputs.zig_key }}
      llvm_tag: ${{ steps.check.outputs.llvm_tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out zig-build
        run: bash .github/scripts/clone-zig-build.sh "${{ inputs.zig_build_ref || 'main' }}"

      - name: Compute keys
        id: keys
        working-directory: zig-build
        run: |
          # plain assignments so a missing/failing script fails the step
          COMMIT=$(git rev-parse HEAD)
          HOST_KEY=$(bash ./cross-manifest.sh key host)
          LLVM_KEY=$(bash ./cross-manifest.sh key llvm "$TARGET" "$CPU")
          ZIG_KEY=$(bash ./cross-manifest.sh key zig "$TARGET" "$CPU")
          [ -n "$HOST_KEY" ] && [ -n "$LLVM_KEY" ] && [ -n "$ZIG_KEY" ] || { echo "::error::empty key"; exit 1; }
          {
            echo "zig_build_commit=$COMMIT"
            echo "host_key=$HOST_KEY"
            echo "llvm_key=$LLVM_KEY"
            echo "zig_key=$ZIG_KEY"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Find matching LLVM release; skip if this zig_key is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_KEY: ${{ steps.keys.outputs.llvm_key }}
          ZIG_KEY: ${{ steps.keys.outputs.zig_key }}
        run: |
          # $1 repo, $2 manifest field, $3 wanted value -> prints the matching tag
          find_release () {
            local tag key
            for tag in $(gh release list -R "$1" -L 30 --json tagName -q '.[].tagName'); do
              key=$(gh release download "$tag" -R "$1" -p manifest.json -O - 2>/dev/null \
                | jq -r --arg f "$2" '.[$f] // empty' || true)
              # releases from before the zig-build rework have no manifest (empty key)
              if [ -n "$key" ] && [ "$key" = "$3" ]; then echo "$tag"; return; fi
            done
          }
          DONE=$(find_release "$GITHUB_REPOSITORY" zig_key "$ZIG_KEY")
          LLVM_TAG=$(find_release "$LLVM_REPO" llvm_key "$LLVM_KEY")
          echo "llvm_tag=$LLVM_TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$DONE" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "::notice::zig_key unchanged; already released as $DONE"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$LLVM_TAG" ]; then
            echo "::notice::$LLVM_REPO has no release for llvm_key $LLVM_KEY yet; waiting for it"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Using LLVM from $LLVM_REPO $LLVM_TAG"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      LLVM_TAG: ${{ needs.prepare.outputs.llvm_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          zig_build_commit: ${{ needs.prepare.outputs.zig_build_commit }}

      - name: Restore stage3
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: zig-build/bin/stage3
          key: stage3-${{ needs.prepare.outputs.host_key }}

      - name: Build stage3
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: zig-build
        run: bash ./build-stage3.sh

      - name: Save stage3
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: zig-build/bin/stage3
          key: stage3-${{ needs.prepare.outputs.host_key }}

      - name: Download cross LLVM from ${{ env.LLVM_REPO }} ${{ env.LLVM_TAG }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$LLVM_TAG" -R "$LLVM_REPO" -p "llvm-$TARGET-$CPU.tar.xz"
          mkdir -p zig-build/build/cross
          tar -xJf "llvm-$TARGET-$CPU.tar.xz" -C zig-build/build/cross

      - name: Cross-compile Zig
        working-directory: zig-build
        run: bash ./build-zig-cross.sh "$TARGET" "$CPU"

      - name: Smoke-test under qemu
        working-directory: zig-build
        run: bash ./test-zig-cross.sh "$TARGET" "$CPU"

      - name: Package
        id: package
        run: |
          VERSION=$(zig-build/bin/stage3/bin/zig version)
          NAME="zig-$TARGET-$CPU-$VERSION"
          mv "zig-build/build/cross/zig-$TARGET-$CPU" "$NAME"
          tar -cJf "$NAME.tar.xz" "$NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=$NAME.tar.xz" >> "$GITHUB_OUTPUT"

      - name: Write manifest
        working-directory: zig-build
        env:
          ZIG_VERSION: ${{ steps.package.outputs.version }}
        run: |
          bash ./cross-manifest.sh json "$TARGET" "$CPU" \
            | jq --arg v "$ZIG_VERSION" --arg r "$LLVM_REPO" --arg t "$LLVM_TAG" \
                '. + {zig_version: $v, llvm_release: "\($r)@\($t)"}' > ../manifest.json
          cat ../manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          # count tags and reserved names too, so the first attempt normally succeeds
          LATEST=$( { gh release list -R "$GITHUB_REPOSITORY" -L 100 --json tagName -q '.[].tagName'
                      gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate -q '.[].ref | ltrimstr("refs/tags/")'
                      printf '%s\n' $RESERVED_TAGS
                    } | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -1)
          N=$(( ${LATEST:-0} + 1 ))
          jq -r '"Zig `\(.zig_version)` for `\(.target)` (`\(.cpu)`), cross-compiled by " +
            "[zig-build `\(.zig_build_commit[0:12])`](https://codeberg.org/emanspeaks/zig-build/src/commit/\(.zig_build_commit)) " +
            "and smoke-tested under qemu (runs, and builds + runs zig and C hello worlds).\n\n" +
            "| Field | Value |\n|---|---|\n" +
            "| zig-src | `\(.zig_src_commit[0:12])` |\n" +
            "| LLVM | \(.llvm_release) |\n" +
            "| zig_key | `\(.zig_key)` |\n\n" +
            "Unpack and run `zig` from the extracted folder; `manifest.json` lists every input."' manifest.json > notes.md
          # fallback for a reserved name missing from RESERVED_TAGS: GitHub rejects
          # it and lists reserved names nowhere, so step past it
          for _ in $(seq 20); do
            TAG="v$N"
            if gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
                --title "Zig ${{ steps.package.outputs.version }} for $TARGET $TAG" \
                --notes-file notes.md \
                "$ARCHIVE" manifest.json 2> err.txt; then
              echo "Published $TAG"; exit 0
            fi
            cat err.txt
            grep -qiE 'immutable release|already exists' err.txt || exit 1
            N=$((N + 1))
          done
          echo "::error::no free release tag found"; exit 1
